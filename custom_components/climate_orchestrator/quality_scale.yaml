rules:
  # --- Bronze ---------------------------------------------------------------
  action-setup:
    status: done
    comment: Only entity services; registered on the climate platform.
  appropriate-polling:
    status: done
    comment: Event-driven on tracked entities, with a 60 s keepalive cycle.
  brands:
    status: done
    comment: In-integration brand/ images (HA >= 2026.3 local brand images).
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >-
      Nothing to connect to: the flow selects existing Home Assistant
      entities, which need not be available at setup time.
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: Single instance; the flow aborts when an entry exists.

  # --- Silver ---------------------------------------------------------------
  action-exceptions:
    status: done
    comment: >-
      Valve maintenance raises a translated ServiceValidationError when no
      valve numbers are discoverable.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      Device command failures log once per outage and once on recovery
      (DeviceRuntime.command_failing latch); state is also surfaced via the
      Status sensor and repairs.
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No authentication — orchestrates local Home Assistant entities.
  test-coverage:
    status: done
    comment: CI enforces a 95% branch-coverage gate (coverage fail_under).

  # --- Gold -----------------------------------------------------------------
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >-
      No discoverable hardware of its own — the integration orchestrates
      entities the user explicitly selects.
  discovery-update-info:
    status: exempt
    comment: See discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: >-
      Managed devices are explicitly user-selected; changing them via the
      options flow reloads the entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: The per-device runtime/cycle diagnostic sensors default to disabled.
  entity-translations: done
  exception-translations:
    status: done
    comment: Service exceptions use translation keys (strings.json exceptions).
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: The options flow edits every setup input (devices, sensors, hints).
  repair-issues: done
  stale-devices:
    status: exempt
    comment: A single hub device per entry; nothing can go stale.

  # --- Platinum ---------------------------------------------------------------
  async-dependency:
    status: done
    comment: >-
      scipy is synchronous; the MPC observe/identify/optimise math runs in an
      executor job, keeping the event loop unblocked.
  inject-websession:
    status: exempt
    comment: No HTTP dependency.
  strict-typing: done
