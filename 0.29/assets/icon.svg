<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22B8C9"/>
      <stop offset="1" stop-color="#2B5FB0"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#6FD0E2"/>
    </linearGradient>
  </defs>

  <!-- App-icon background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- House -->
  <path d="M256 104 L404 224 V396 a24 24 0 0 1 -24 24 H132 a24 24 0 0 1 -24 -24 V224 Z"
        fill="none" stroke="#FFFFFF" stroke-width="26"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Thermostat dial inside the house -->
  <circle cx="256" cy="300" r="74" fill="none" stroke="#FFFFFF" stroke-width="20" opacity="0.35"/>
  <!-- Heat/cool arc -->
  <path d="M256 226 a74 74 0 0 1 0 148"
        fill="none" stroke="url(#dial)" stroke-width="20" stroke-linecap="round"/>
  <!-- Setpoint marker -->
  <circle cx="256" cy="226" r="16" fill="#FFFFFF"/>
</svg>
