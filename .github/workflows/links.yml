name: Links

# Weekly (not per-push: external links rate-limit and flake) link check over
# everything reader-facing: README/CHANGELOG, the docs-site chapters, and the
# issue/PR templates. Internal docs links and anchors are already gated
# per-PR by `mkdocs build --strict` in ci.yml — lychee's job is the
# *external* links those builds can't verify (and the repo-level files
# mkdocs never sees).
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # files the failure-tracking issue
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --include-fragments: also verify #anchor targets (the docs
          # cross-link section anchors between pages).
          args: >-
            --no-progress --include-fragments
            README.md CHANGELOG.md SECURITY.md
            "docs/**/*.md"
            ".github/ISSUE_TEMPLATE/*.yml"
            ".github/PULL_REQUEST_TEMPLATE.md"
          fail: true
      - name: File a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Canary: the weekly link check is failing"
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing: $url"
          else
            # --force: idempotent (updates instead of failing if it exists).
            gh label create ci --repo "$GITHUB_REPOSITORY" --force \
              --description "Automated CI failure tracking" --color D93F0B
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label ci \
              --body "The weekly link check failed (dead external link?): $url"
          fi
      - name: Close the tracking issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Canary: the weekly link check is failing"
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            commit="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Passing again as of ${GITHUB_SHA:0:7} ($commit) — green run: $url"
          fi
