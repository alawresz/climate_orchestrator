name: Links

# Weekly (not per-push: external links rate-limit and flake) docs link check.
# README/DESIGN/CHANGELOG are the load-bearing user docs, and the GitLab->
# GitHub migration is exactly the kind of event that leaves dead links behind.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --no-progress README.md DESIGN.md CHANGELOG.md
          fail: true
