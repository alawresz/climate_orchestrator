name: CodeQL

# SAST over the Python source and the GitHub Actions workflows. Python yield
# next to ruff/mypy is modest; the actions pack covers workflow-injection
# patterns (complementing zizmor) and keeps the Security → Code scanning
# panel fed. Runs on every push to main — unfiltered, so workflow and config
# changes are analyzed too — plus weekly for newly added queries.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 3" # Wednesdays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the analysis results
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: ${{ matrix.language }}
      - name: Run analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"
