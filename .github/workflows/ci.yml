name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv (with Python 3.14, HA's runtime)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff lint + format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Spell check (codespell)
        # Same pinned hook + [tool.codespell] settings as local pre-commit.
        run: uvx pre-commit run codespell --all-files --show-diff-on-failure
      - name: mypy
        run: uv run mypy custom_components/climate_orchestrator
      - name: pytest (with coverage + JUnit results)
        run: >-
          uv run pytest
          --cov=custom_components/climate_orchestrator
          --cov-report=xml --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          # Public repos upload tokenless; add the secret if uploads start failing.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        # Runs even when pytest fails — failure rates are the point. The
        # dedicated test-results-action is deprecated; the main action handles
        # JUnit uploads via report_type since v5.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  hassfest:
    name: hassfest (HA manifest/structure validation)
    runs-on: ubuntu-latest
    # Advisory until a green run is confirmed: hassfest treats strings.json as
    # the translation source, while we ship translations/en.json.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # Skip the brands check until the logo is submitted to
          # home-assistant/brands.
          ignore: brands
