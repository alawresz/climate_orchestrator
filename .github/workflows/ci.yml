name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same ref obsoletes the running build. Safe to cancel:
  # release.yml only reacts to runs that *completed successfully*.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip the pull_request event only when the push event already covers the
    # PR's head branch (same-repo feat/** and fix/** — those would double
    # every job). Forks and other branch names (e.g. Dependabot's
    # dependabot/**) have no push runs here, so their PRs get CI from this
    # event — auto-merge gates on these checks.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.event.pull_request.head.ref, 'feat/') ||
        startsWith(github.event.pull_request.head.ref, 'fix/'))
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff base is a tag / another branch
      - name: Classify changed paths
        id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A PR is judged by everything it changes against its base.
            base="origin/$GITHUB_BASE_REF"
          else
            # A push is judged against the last release tag: exactly the
            # commits semantic-release would put in the next release. (Diffing
            # against the previous push instead would let an untested code
            # push slip into a release if a later docs-only push went green.)
            base="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base"...HEAD)"
          else
            changed="" # no tag yet: run everything
          fi
          echo "$changed"
          classify() {
            if [ -z "$base" ] || echo "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          classify code '^(custom_components|tests|\.github/workflows)/|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$'
          classify docs '^docs/|^(mkdocs\.yml|README\.md|CHANGELOG\.md)$'
          classify integration '^custom_components/|^hacs\.json$'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv (with Python 3.14, HA's runtime)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"
      - name: Lockfile in sync with pyproject.toml
        # A pyproject edit without a re-run of `uv lock` drifts silently —
        # the locked env would no longer reflect the declared dependencies.
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff lint + format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Spell check (codespell)
        # Same pinned hook + [tool.codespell] settings as local pre-commit.
        run: uvx pre-commit run codespell --all-files --show-diff-on-failure
      - name: strings.json in sync with translations/en.json
        # strings.json is the hassfest-validated translation source; en.json is
        # what HA serves at runtime. They are byte-identical copies by policy.
        run: >-
          diff -u custom_components/climate_orchestrator/strings.json
          custom_components/climate_orchestrator/translations/en.json
      - name: Workflow security lint (zizmor)
        run: uvx zizmor --no-progress .github/workflows
      - name: Workflow correctness lint (actionlint)
        # Complements zizmor (security): expression/syntax errors and
        # shellcheck over run blocks. actionlint-py ships the real binary.
        run: uvx --from actionlint-py==1.7.12.24 actionlint

  test:
    name: Type-check & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv (with Python 3.14, HA's runtime)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --dev
      - name: mypy
        run: uv run mypy custom_components/climate_orchestrator
      - name: pytest (with coverage + JUnit results)
        env:
          HYPOTHESIS_PROFILE: ci
        run: >-
          uv run pytest
          --timeout=120
          --cov=custom_components/climate_orchestrator
          --cov-report=xml --cov-report=term-missing
          --junitxml=junit.xml -o junit_family=legacy
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          # Public repos upload tokenless; add the secret if uploads start failing.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov (Test Analytics)
        # Runs even when pytest fails — failure rates are the point. The
        # dedicated test-results-action is deprecated; the main action handles
        # JUnit uploads via report_type since v5.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
          files: junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: the git-revision-date-localized plugin derives
          # per-page "last updated" dates from git log.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14"
      - name: MkDocs build (strict)
        # Same command as the Pages deploy — a broken docs link fails the PR.
        run: uv run --only-group docs mkdocs build --strict

  hassfest:
    name: hassfest (HA manifest/structure validation)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Upstream only publishes a moving branch (no tags/releases to pin);
      # accepted: the job runs with a read-only token on a public repo.
      - uses: home-assistant/actions/hassfest@master # zizmor: ignore[unpinned-uses]

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Same accepted risk as hassfest: validation-only, read-only token.
      - uses: hacs/action@main # zizmor: ignore[unpinned-uses]
        with:
          category: integration
          # The HACS brands check looks for the domain in home-assistant/brands;
          # since HA 2026.3 the icons ship inside the integration instead
          # (custom_components/climate_orchestrator/brand/), which takes
          # priority over the CDN. Keep ignoring the upstream-repo check.
          ignore: brands
