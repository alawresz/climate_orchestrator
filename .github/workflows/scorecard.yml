name: Scorecard

# OpenSSF Scorecard: weekly scoring of the repo's supply-chain practices
# (pinned actions, token permissions, dependency update tooling, ...).
# Results land in the Security → Code scanning panel as SARIF, and are
# published to the public scorecard API that backs the README badge.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the link check
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the scorecard API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
