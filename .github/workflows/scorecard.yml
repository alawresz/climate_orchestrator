name: Scorecard

# OpenSSF Scorecard: weekly scoring of the repo's supply-chain practices
# (pinned actions, token permissions, dependency update tooling, ...).
# Results land in the Security → Code scanning panel as SARIF, and are
# published to the public scorecard API that backs the README badge.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC, after the link check
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the scorecard API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
