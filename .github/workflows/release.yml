name: Release

# Run only after CI has gone green, so we never tag a broken commit.
# main -> stable release; feat/* and fix/* -> prerelease (per pyproject config).
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main, "feat/**", "fix/**"]

# Needs write access to push the version-bump commit + tag and create the release.
permissions:
  contents: write
  # For the build-provenance attestation of the HACS zip asset.
  id-token: write
  attestations: write
  # To dispatch the versioned-docs deploy (docs.yml) after a release.
  actions: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    # Only release CI runs from this repo's own branches — a fork PR whose
    # branch happens to match feat/** must never reach a contents:write job.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      # PSR pushes the version-bump commit + tag with the checked-out
      # credentials, so they must persist here (zizmor's artipacked finding
      # is accepted by design for this job).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked]
        with:
          # Release from the branch CI ran on (main or dev).
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python Semantic Release
        id: release
        # Reads [tool.semantic_release] branch config to decide stable vs
        # prerelease, bumps pyproject.toml + manifest.json, updates the
        # changelog, commits + tags, and publishes the GitHub Release.
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the HACS zip to the release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@68eaac9f1f594e9ec4b985245d06355734f43eea # v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
      - name: Deploy versioned docs
        # PSR creates the GitHub Release with the default GITHUB_TOKEN, and
        # GitHub never fires `release` events for token-created releases — so
        # docs.yml's `on: release` trigger won't see ours. workflow_dispatch
        # IS token-triggerable, so kick the versioned deploy explicitly.
        # Stable releases only: prereleases must not move the docs.
        if: >-
          steps.release.outputs.released == 'true' &&
          github.event.workflow_run.head_branch == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # X.Y.Z -> X.Y (patches update their minor's docs)
          gh workflow run docs.yml --ref main \
            -f version="${VERSION%.*}" -f set_latest=true
      - name: Attest build provenance of the HACS zip
        # Verifiable provenance for the exact artifact HACS installs:
        #   gh attestation verify climate_orchestrator.zip -R <owner>/<repo>
        if: steps.release.outputs.released == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/climate_orchestrator.zip
