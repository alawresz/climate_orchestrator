name: Release

# Run only after CI has gone green, so we never tag a broken commit.
# main -> stable release; feat/* and fix/* -> prerelease (per pyproject config).
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI"]
    types: [completed]
    branches: [main, "feat/**", "fix/**"]

# All write scopes live on the release job itself (least privilege at the
# workflow level; there is only one job, but scanners score the two levels
# differently and job-level is the tighter habit).
permissions: {}

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Push the version-bump commit + tag and create the release.
      contents: write
      # For the build-provenance attestation of the HACS zip asset.
      id-token: write
      attestations: write
      # To dispatch the versioned-docs deploy (docs.yml) after a release.
      actions: write
    # Only release CI runs from this repo's own branches — a fork PR whose
    # branch happens to match feat/** must never reach a contents:write job.
    # And only *push* runs: pull_request runs of CI skip their jobs for
    # same-repo branches (the push run is the real gate), so an all-skipped
    # PR run finishing "success" first must not trigger a release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Mint an installation token for the release app
        # PSR authenticates as a dedicated GitHub App on the main
        # ruleset's bypass list. The installation token is short-lived.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scope the minted token to exactly what PSR needs: pushing the
          # bump commit + tag and creating the release with its assets.
          permission-contents: write
      # PSR pushes the version-bump commit + tag with the checked-out
      # credentials, so they must persist here (zizmor's artipacked finding
      # is accepted by design for this job).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0 # PSR walks history; also fetches all branches
          token: ${{ steps.app-token.outputs.token }}
      - name: Switch to the branch CI validated
        # Checkout stays on the default branch (no event data in action
        # inputs); the branch switch happens here, where the job guard above
        # has already proven it is a same-repo branch from the workflow_run
        # branches filter — and env interpolation keeps the name out of the
        # shell syntax.
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: git checkout "$HEAD_BRANCH"
      - name: Python Semantic Release
        id: release
        # Reads [tool.semantic_release] branch config to decide stable vs
        # prerelease, bumps manifest.json, updates the changelog, commits +
        # tags, and publishes the GitHub Release (as the release app).
        uses: python-semantic-release/python-semantic-release@350c48fcb3ffcdfd2e0a235206bc2ecea6b69df0 # v10.5.3
        with:
          github_token: ${{ steps.app-token.outputs.token }}
      - name: Upload the HACS zip to the release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@68eaac9f1f594e9ec4b985245d06355734f43eea # v10.5.3
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}
      - name: Verify the published zip
        # The zip is what HACS actually installs; the attestation proves who
        # built it, not that it's well-formed. Re-download the published
        # asset and check the two things HACS depends on: manifest.json at
        # the zip root, with a version matching the tag.
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern climate_orchestrator.zip --dir "$tmp"
          unzip -q "$tmp/climate_orchestrator.zip" -d "$tmp/zip"
          test -f "$tmp/zip/manifest.json"
          version="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["version"])' \
            "$tmp/zip/manifest.json")"
          test "v$version" = "$TAG"
          echo "zip OK: manifest.json at root, version $version matches $TAG"
      - name: Deploy versioned docs
        # docs.yml deliberately has no `release` trigger: app-token-created
        # releases fire release events for stables AND prereleases, and a
        # prerelease must never move the docs. This explicit dispatch is the
        # only deploy path — stable releases only.
        if: >-
          steps.release.outputs.released == 'true' &&
          github.event.workflow_run.head_branch == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # X.Y.Z -> X.Y (patches update their minor's docs)
          gh workflow run docs.yml --ref main \
            -f version="${VERSION%.*}" -f set_latest=true
      - name: Attest build provenance of the HACS zip
        # Verifiable provenance for the exact artifact HACS installs:
        #   gh attestation verify climate_orchestrator.zip -R <owner>/<repo>
        id: attest
        if: steps.release.outputs.released == 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/climate_orchestrator.zip
      - name: Attach the provenance bundle to the release
        # The attestation store is the authoritative copy (gh attestation
        # verify works without this); attaching the Sigstore bundle as a
        # release asset makes the provenance visible to scanners and usable
        # offline (cosign verify-blob --bundle).
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" climate_orchestrator.zip.intoto.jsonl
          gh release upload "$TAG" climate_orchestrator.zip.intoto.jsonl --clobber
