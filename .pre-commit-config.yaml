repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.2.0
    hooks:
      - id: mypy
        additional_dependencies: [homeassistant]
        files: ^custom_components/
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # Settings live in [tool.codespell] in pyproject.toml (shared with CI).
        additional_dependencies: [tomli]
  - repo: local
    hooks:
      - id: strings-en-sync
        name: strings.json matches translations/en.json
        # HA convention: strings.json is the translation source; en.json is its
        # verbatim copy. hassfest validates strings.json, HA runtime reads
        # en.json — they must never drift.
        entry: diff -u custom_components/climate_orchestrator/strings.json custom_components/climate_orchestrator/translations/en.json
        language: system
        files: (strings\.json|translations/en\.json)$
        pass_filenames: false
