[project]
name = "climate-orchestrator"
version = "0.25.0"
description = "Climate Orchestrator — whole-home climate orchestration for Home Assistant"
readme = "README.md"
# Dev/test environment floor — tracks current Home Assistant's runtime
# (2026.6 needs >=3.14.2). A looser floor makes uv keep extra lockfile
# resolution forks for hypothetical old interpreters, pinned to ancient HA
# releases full of known CVEs. Source compatibility is governed separately
# by ruff's target-version below.
requires-python = ">=3.14.2"
license = { text = "MIT" }
authors = [{ name = "Aleksander Ławresz" }]
dependencies = []

[dependency-groups]
dev = [
  # pytest-homeassistant-custom-component pins the exact HA-compatible test
  # stack transitively (pytest, pytest-asyncio, pytest-cov, syrupy, homeassistant,
  # numpy, ...). Do NOT pin those separately here — our floors would collide with
  # its exact pins. Bumping PHACC moves the whole stack together, coherently.
  "pytest-homeassistant-custom-component>=0.13",
  # Not provided by PHACC, so declared explicitly:
  "scipy>=1.11",            # also the integration's runtime requirement
  "hypothesis>=6.0",        # property-based tests
  "pytest-randomly>=3.15",  # randomize test order to surface inter-test leakage
  "pytest-timeout>=2.3",    # CI passes --timeout explicitly (hang protection)
  "ruff==0.15.15",          # linter/formatter (exact, matches CI + pre-commit)
  "mypy>=1.11",             # type checker
  "mutmut>=3.5,<4",         # mutation testing for the pure control/ math
  "python-semantic-release>=10.5,<11",  # local release tooling (CI uses the action)
]
# Docs toolchain (site under docs/ + mkdocs.yml). Exact pins: the same
# versions build locally (`uv run --group docs mkdocs serve`), in the CI gate,
# and in the Pages deploy — no drift between preview and production.
docs = [
  "mkdocs-material==9.7.6",
  "mkdocs-panzoom-plugin==0.5.2",
  "mike==2.2.0",
]

[tool.ruff]
# Source still targets py313 (oldest HA install we aim to run on), even though
# the dev env itself runs 3.14 — see requires-python above.
target-version = "py313"
line-length = 88
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "ASYNC",# flake8-async
  "RUF",  # ruff-specific
  "TC",   # flake8-type-checking (guard type-only imports)
  "RET",  # flake8-return
  "PTH",  # flake8-use-pathlib
  "DTZ",  # flake8-datetimez (no naive datetimes)
  "LOG",  # flake8-logging
  "G",    # flake8-logging-format
  "PERF", # perflint
  "TRY",  # tryceratops (exception hygiene)
  "D",    # pydocstyle
]
# RUF012: HA entity `_attr_*` lists are effectively class-level constants;
# annotating them ClassVar conflicts with the base classes' instance attrs.
ignore = ["RUF012"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests are dev-only: docstrings aren't required, and TYPE_CHECKING import
# guards add churn without runtime benefit.
"tests/**" = ["D", "TC"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
force-sort-within-sections = true

[tool.mypy]
# Must match the dev env's HA: mypy parses homeassistant's installed sources,
# which use 3.14-only syntax. The py313 source-compat floor is enforced by
# ruff's target-version instead (ruff never parses site-packages).
python_version = "3.14"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
plugins = []
# Tests use HA helpers that are not fully typed; keep strictness on source.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
# SciPy ships no type stubs.
[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
# Home Assistant re-exports many public names (HVACMode, ClimateEntityFeature,
# ATTR_*, SERVICE_*, DOMAIN, ...) without an explicit __all__, which trips
# strict no-implicit-reexport. Treat its modules' imports as re-exported.
[[tool.mypy.overrides]]
module = "homeassistant.*"
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Coverage is NOT forced here: that breaks single-file runs (fail_under) and
# mutmut's per-mutant subset runs. CI passes --cov explicitly; run it locally
# with `uv run pytest --cov=custom_components/climate_orchestrator`.
addopts = "-q"
filterwarnings = [
  # False positive on CPython >= 3.13: hypothesis's register_random heuristic
  # trusts gc.get_referrers(), whose behaviour changed (cpython#118522). The
  # warning branch only fires when the refcount proves other references exist
  # (a truly dead PRNG raises ReferenceError instead), so the pytest-randomly
  # PRNG is alive and managed. Scoped to this exact message.
  "ignore:It looks like `register_random` was passed:hypothesis.errors.HypothesisWarning",
]

[tool.coverage.run]
branch = true
source = ["custom_components/climate_orchestrator"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.codespell]
# Shared by the pre-commit hook and the CI step. `hass` is the Home Assistant
# fixture/handle, not a misspelt "hash"; skip the lockfile and syrupy snapshots.
ignore-words-list = "hass"
skip = "*.lock,*.ambr,./.git,./htmlcov,./mutants"

[tool.mutmut]
# Mutation-test only the pure control/ math (the highest-value, subtlest code):
# Hypothesis checks invariants, but a flipped sign or mis-scaled `dt` in the
# thermal model / optimizer / comfort curves would still pass. Run in the HA dev
# env (Python 3.14) with `uv run mutmut run`, then `uv run mutmut results`.
paths_to_mutate = ["custom_components/climate_orchestrator/control/"]
# The pure unit tests are what kill control/ mutants; skipping the hass-fixture
# suites makes mutation runs far faster and avoids the heavy HA harness.
tests_dir = ["tests/unit/"]
# mutmut copies only `paths_to_mutate` into its mutants/ work dir, but control/
# (and conftest.py) import the rest of the package (const, models, coordinator,
# ...). Copy the whole package so imports resolve; only control/ is mutated.
also_copy = ["custom_components/"]

[tool.uv]
# This is a Home Assistant custom-component layout, not an installable package.
package = false

[tool.semantic_release]
# Version lives in two places; keep both in lock-step with the release tag.
version_toml = ["pyproject.toml:project.version"]
version_variables = [
  "custom_components/climate_orchestrator/manifest.json:version",
]
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
build_command = """
mkdir -p dist
python -c "import shutil; shutil.make_archive('dist/climate_orchestrator', 'zip', 'custom_components/climate_orchestrator')"
"""
allow_zero_version = true

[tool.semantic_release.publish]
# Attach the built zip to the GitHub Release (these are the defaults, pinned
# explicitly because HACS zip_release installs depend on the asset existing).
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# Pushing to a feature/fix branch cuts a prerelease (e.g. 0.12.0rc1); merging
# it into main promotes to the stable version. The version is PEP 440 (`rcN`),
# so the branch name itself can't appear in it.
[tool.semantic_release.branches.prerelease]
match = "(feat|fix)/.+"
prerelease = true
prerelease_token = "rc"
