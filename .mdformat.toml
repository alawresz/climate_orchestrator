# Canonical Markdown formatting for the repo.
#
# Run:  uv run mdformat .
#
# Requires Python 3.13+ for the `exclude` This excludes `mdformat .` from
# descending into the virtualenv / build output and, critically, from
# reformatting the semantic-release-owned changelogs (those carry YAML
# frontmatter mdformat would mangle, and PSR rewrites them).
#
# Plugins (declared in the `dev` dependency group): mdformat-gfm (aligns GFM
# tables), mdformat-mkdocs (preserves MkDocs Material admonitions, content tabs,
# math). Point your editor's mdformat integration at this file so the IDE and
# the CLI produce identical output.
number = true   # keep 1. 2. 3. ordered lists (not all "1.")
wrap = "keep"   # never re-wrap prose paragraphs

exclude = [
  # Generated / frontmatter-bearing files semantic-release owns (git-tracked —
  # these two are the ones that actually matter to keep out of a commit).
  "CHANGELOG.md",
  "docs/project/changelog.md",
  # Virtualenv and build output (gitignored, but skip them so `mdformat .` is
  # fast and quiet).
  ".venv/**",
  "site/**",
  "htmlcov/**",
  "mutants/**",
  "**/.pytest_cache/**",
]

[plugin.mkdocs]
# List continuations align to the text (2-space), not forced to 4 spaces.
align_semantic_breaks_in_lists = true
